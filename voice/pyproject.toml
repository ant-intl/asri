[project]
name = "asri-voice"
version = "0.1.0"
description = "ASRI Voice — low-latency speech-to-speech pipeline engine"
requires-python = ">=3.10"
dependencies = [
    "lingua-language-detector>=2.0.2",
    "nltk==3.9.1",
    "torch==2.11.0; platform_system == 'Darwin'",
    "torchaudio==2.11.0; platform_system == 'Darwin'",
    "torch>=2.4.0; platform_system != 'Darwin'",
    "torchvision>=0.26.0",
    "sounddevice>=0.5.0",
    "websockets>=12.0",
    "funasr>=1.1.6",
    "faster-whisper>=1.0.3",
    "modelscope>=1.17.1",
    "onnxruntime<1.24; python_version < '3.11'",
    "openai==2.28.0",
    "lightning-whisper-mlx>=0.0.10; platform_system == 'Darwin'",
    "mlx-lm>=0.14.0; platform_system == 'Darwin'",
    "mlx-vlm==0.4.1; platform_system == 'Darwin'",
    "mlx-audio==0.4.1; platform_system == 'Darwin'",
    "nano-parakeet>=0.2.0; platform_system != 'Darwin'",
    "faster-qwen3-tts>=0.2.5; platform_system != 'Darwin'",
    "requests>=2.31.0",
    "pysocks>=1.7.1",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "dashscope>=1.14.0",
    "soundfile>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asri_voice"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# "asri_voice" on pythonpath so tests can use ``from pipeline.xxx import ...``
# (the directory itself, not the parent — preserves the original short-form imports).
# "." is also included so ``from asri_voice.xxx`` works.
# ".." brings in project-root modules like ``core.agent_loop``.
pythonpath = ["asri_voice", ".", ".."]

[tool.uv]
prerelease = "allow"
